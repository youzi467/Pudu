t{font-size:.7rem;line-height:.7;color:#1f2933;}.jp-dot2{font-size:1rem;margin-left:1px;color:#1f2933;}.jp-aug{font-size:1.15rem;letter-spacing:-2px;margin-left:2px;align-self:center;}.beam{position:relative;display:inline-flex;align-items:flex-end;}.beam-lines{position:absolute;left:8px;right:8px;bottom:3px;}.jp-under{position:absolute;left:50%;transform:translateX(-50%);bottom:2px;display:block;width:1.5em;}.jp-tie{position:absolute;top:-12px;left:50%;transform:translateX(-50%);}</style></head><body><div class="score"><div class="header"><div class="title">小星星 (内嵌样例)</div><div class="key">1=C 4/4 (major)</div></div><div class="line"><span class="voice-label">voice1</span><div class="measure"><span class="note"><span class="jp-num">1</span></span><span class="note"><span class="jp-num">1</span></span><span class="note"><span class="jp-num">5</span></span><span class="note"><span class="jp-num">5</span></span></div><span class="barline"></span><div class="measure"><span class="note"><span class="jp-num">6</span></span><span class="note"><span class="jp-num">6</span></span><span class="note"><span class="jp-num">5</span><span class="jp-aug">—</span></span></div><span class="barline final"></span></div></div></body></html>
