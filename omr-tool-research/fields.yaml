# 调研字段定义 (fields.yaml)

## 一、技术选型对比维度 (对应问题1)
- dev_difficulty: 开发难度 — 从零到MVP所需工程量、调试复杂度
- accuracy: 识别准确率 — 在MVP约束(单声部/≤2升降号/印刷体)下的实测/文献准确率
- learning_value: 学习价值 — 能积累多少CV/DL/大模型相关工程与算法经验 (用户最看重)
- maintenance_cost: 维护成本 — 依赖项、长期可维护性、跨平台/版本兼容风险
- time_to_mvp: 上手速度 — 做出可运行第一版的时间

## 二、系统设计维度 (对应问题2)
- module_responsibility: 各模块职责 — 输入解析/乐谱识别/MusicXML生成/格式转换
- interface_def: 模块间接口定义 — 数据结构/API契约
- data_flow: 数据流向 — 从原始PDF/图片到MusicXML/简谱的流转
- tech_stack: 每层推荐技术栈 (C++ vs Python 边界)

## 三、学习路线维度 (对应问题3)
- phase: 阶段划分 (启动→MVP)
- tech_points: 每阶段关键技术点
- resources: 推荐学习资源 (课程/书/库/数据集)
- deliverable: 阶段产出目标
- est_time: 预估时间
- difficulty: 难度 (★~★★★★★)

## 不确定字段 (deep阶段自动填充)
- audiveris_2026_status: Audiveris最新版本与维护状态
- deep_omr_sota_accuracy: 端到端OMR在印刷体上的SOTA准确率(2024-2026)
- best_cpp_musicxml_lib: C++下最实用的MusicXML I/O库
- jianpu_in_musicxml: 简谱经MusicXML中转的表达方式
