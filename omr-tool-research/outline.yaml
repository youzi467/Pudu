topic: 五线谱/简谱互转工具 — 技术选型·系统架构·学习路线
created: 2026-07-11
time_range: 2024-2026 (含稳定经典方案)
user_profile:
  major: 数字媒体技术
  grade: 准大二
  skills: C++基础, 丰富乐理知识
  goal: 通过谱渡项目提升AI能力, 为研究生转向AI/大模型做准备
mvp_scope:
  platform: Windows
  input: PDF(矢量+扫描) / JPG 印刷体五线谱或简谱
  intermediate: MusicXML
  constraints: 单声部, ≤2升降号, 无装饰音, 无歌词
  output_v1: 五线谱→简谱 生成首调简谱(经MusicXML中转)

items:
  - opencv_custom: 基于OpenCV自研传统CV识别方案
  - audiveris: Audiveris 开源OMR (2024-2026现状)
  - deep_omr: 深度学习端到端OMR (DeepOMR / DeepScores / Seq2Seq)
  - commercial_ai: 商业AI OMR参考 (SmartScore / PhotoScore 等, 仅对标)
  - musicxml_eco: MusicXML中间格式与C++/Python生态库

execution:
  batch_size: 2
  items_per_agent: 3
  output_dir: ./results
